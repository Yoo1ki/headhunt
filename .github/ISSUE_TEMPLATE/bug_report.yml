name: Bug report
description: Report a reproducible problem in Headhunt
title: '[Bug]: '
labels: [bug]
body:
  - type: markdown
    attributes:
      value: >-
        Do not include Import URLs, tokens, environment files, or other
        credentials. Report security issues privately through GitHub Security.
  - type: textarea
    id: description
    attributes:
      label: Problem
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open …
        2. Select …
        3. Observe …
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and device
      placeholder: Chrome 140, Android 16
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add sanitized screenshots or console errors when useful.
